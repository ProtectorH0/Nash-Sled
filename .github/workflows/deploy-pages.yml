name: Deploy Quartz Site to GitHub Pages

on:
  push:
    branches: ["v5"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Если у тебя есть quartz.lock.json и кастомные плагины - оставь эту строку.
      # Если нет (простой сайт) - УДАЛИ эти 3 строки, чтобы не было ошибок.
      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build site
        # Флаг -d public критически важен, чтобы файлы легли в нужную папку
        run: npx quartz build -d public

      - name: Upload artifact for deployment
        # ЭТО ГЛАВНОЕ ИСПРАВЛЕНИЕ: используем специальный экшен для Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
